# Nixpacks build configuration for Railway.
#
# Legacy binary .ppt decks are converted with LibreOffice. It is commented out
# because it adds roughly 500MB to the image and most decks arrive as .pdf or
# .pptx; without it the app returns a clear "re-save as .pptx or .pdf" error
# rather than failing silently. Uncomment to enable .ppt support.
#
# [phases.setup]
# nixPkgs = ["...", "libreoffice"]

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]
