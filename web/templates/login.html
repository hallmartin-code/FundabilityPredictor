{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="eyebrow">Restricted</div>
  <h1 style="font-size:24px;">Access required</h1>
  <p class="lede">This instance is password protected because every analysis calls a paid API.</p>

  <form method="post" action="/login">
    <div class="field">
      <label class="field-label" for="password">Access password</label>
      <input type="password" id="password" name="password" autofocus required
             autocomplete="current-password">
    </div>
    {% if error %}
      <div class="notice notice--error" role="alert" style="margin-top:14px">{{ error }}</div>
    {% endif %}
    <button class="cta" type="submit">Continue</button>
  </form>
</div>
{% endblock %}
