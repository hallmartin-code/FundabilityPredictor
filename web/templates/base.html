<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}TEN Capital Network — Fundability Predictor{% endblock %}</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='20' r='13' fill='%23F3A22A'/><circle cx='78' cy='68' r='13' fill='%2335BEBB'/><circle cx='22' cy='68' r='13' fill='%23EE5A4E'/></svg>">
</head>
<body>

<div class="stage {% block stage_class %}{% endblock %}">

  <a class="brand" href="/">
    {% include "_mark.svg" %}
    <div class="brand-word">Ten Capital<span>Network</span></div>
  </a>

  {% block content %}{% endblock %}

  <footer>
    Powered by TEN Capital Network
    {% block footer_extra %}{% endblock %}
  </footer>

</div>

</body>
</html>
